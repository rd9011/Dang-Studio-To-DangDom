name: Public source validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-source:
    name: Python and localhost browser source
    runs-on: macos-14
    timeout-minutes: 20
    env:
      PYTHONNOUSERSITE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Enforce the no-models, no-user-data boundary
        run: python scripts/scan_staged_secrets.py --tracked

      - name: Install test-only dependency
        run: python -m pip install "Pillow==11.3.0"

      - name: Prepare the pinned LTX source fixture
        run: bash .github/scripts/prepare_ltx_source_fixture.sh

      - name: Compile public Python source
        run: python -m compileall -q outputs/local-video scripts

      - name: Run public source tests
        run: python -m unittest discover -s outputs/local-video -p 'test_*.py'
